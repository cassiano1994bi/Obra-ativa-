<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ObraAtiva · assinatura · PRÉVIA FICTÍCIA</title><style>
body{margin:0;background:#04131e;color:#e5f8ee;font:15px system-ui}header{padding:16px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid #205142}header b{font-size:18px}small{color:#d8c87f}select,button{min-height:42px;background:#123632;color:white;border:1px solid #568d79;border-radius:8px;padding:8px 12px}main{padding:16px;overflow:auto}iframe{display:block;width:100%;height:calc(100vh - 130px);border:1px solid #305a54;border-radius:12px;background:#fff}label{display:flex;align-items:center;gap:8px}
</style></head><body><header><div><b>ObraAtiva · Assinaturas</b><br><small>PRÉVIA FICTÍCIA · sem conta real, sem rede e sem cobrança</small></div><label>Estado <select id="mode"><option value="trial">30 dias grátis</option><option value="expired">Teste encerrado</option><option value="grace">Falha · 3 dias de tolerância</option><option value="active">Pagamento confirmado</option><option value="cancelled">Cancelada · somente consulta</option></select></label><label>Tela <select id="device"><option value="desktop">Computador</option><option value="tablet">Tablet horizontal</option><option value="phone">Celular horizontal</option><option value="portrait">Celular vertical</option></select></label><button id="subscription">Ver assinatura</button><button id="admin">Painel de assinaturas</button></header><main><iframe title="Aplicativo ObraAtiva — dados fictícios" id="preview" src="/tests/premium-workspace-preview.html?app=1&billingtest=trial"></iframe></main><script>
const frame=document.getElementById('preview');document.getElementById('mode').onchange=e=>{frame.src='/tests/premium-workspace-preview.html?app=1&billingtest='+e.target.value};
document.getElementById('device').onchange=e=>{const sizes={desktop:['100%','calc(100vh - 130px)'],tablet:['1024px','768px'],phone:['844px','390px'],portrait:['390px','844px']};[frame.style.width,frame.style.height]=sizes[e.target.value]};
document.getElementById('subscription').onclick=()=>frame.contentWindow.ObraAtivaBilling.open();
document.getElementById('admin').onclick=()=>{frame.contentDocument.getElementById('oaBillingDialog')?.close();frame.contentWindow.openPermissionHub('billing')};
</script></body></html>
